  <rect x="0" y="0" width="1350" height="1402.5" fill="#ffffff"></rect><g transform="translate(40 40) rotate(0 625 20)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="32px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">进程与线程：资源边界、执行与调度</text></g><g transform="translate(40 105) rotate(0 635 27.5)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">软件体系总图「运行环境与进程边界」「操作系统与硬件」的主题展开。</text><text x="0" y="27.5" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">范围：一台计算机上的普通应用进程与操作系统线程。</text></g><g stroke-linecap="round" transform="translate(40 220) rotate(0 355 210)"><path d="M0 0 C208.18 0, 416.36 0, 710 0 M0 0 C185.68 0, 371.36 0, 710 0 M710 0 C710 115.51, 710 231.02, 710 420 M710 0 C710 110.69, 710 221.38, 710 420 M710 420 C555.02 420, 400.05 420, 0 420 M710 420 C479.68 420, 249.35 420, 0 420 M0 420 C0 331.8, 0 243.61, 0 0 M0 420 C0 281.54, 0 143.07, 0 0" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g stroke-linecap="round" transform="translate(970 220) rotate(0 170 210)"><path d="M0 0 C99.7 0, 199.39 0, 340 0 M0 0 C69.87 0, 139.74 0, 340 0 M340 0 C340 145.02, 340 290.04, 340 420 M340 0 C340 89.93, 340 179.85, 340 420 M340 420 C223.96 420, 107.92 420, 0 420 M340 420 C269.89 420, 199.77 420, 0 420 M0 420 C0 297.63, 0 175.25, 0 0 M0 420 C0 322.26, 0 224.51, 0 0" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(65 245) rotate(0 320 17.5)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="28px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">进程 P：一个地址空间与资源边界</text></g><g transform="translate(995 245) rotate(0 145 17.5)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="28px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">进程 Q：另一边界</text></g><g transform="translate(65 310) rotate(0 320 28.75)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">共享代码 / 堆 / 进程资源</text><text x="0" y="28.75" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">示例：图片任务表、完成计数</text></g><g transform="translate(995 310) rotate(0 145 28.75)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">自己的代码与数据</text><text x="0" y="28.75" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">普通变量不自动共用</text></g><g transform="translate(65 460) rotate(0 130 45)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="24px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">线程 A</text><text x="0" y="30" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="24px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">自己的栈与执行上下文</text><text x="0" y="60" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="24px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">处理图片 A</text></g><g transform="translate(430 460) rotate(0 142.5 45)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="24px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">线程 B</text><text x="0" y="30" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="24px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">自己的栈与执行上下文</text><text x="0" y="60" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="24px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">处理图片 B</text></g><g transform="translate(995 460) rotate(0 145 45)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="24px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">线程 C</text><text x="0" y="30" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="24px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">自己的栈与执行上下文</text><text x="0" y="60" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="24px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">执行 Q 中的代码</text></g><g stroke-linecap="round"><g transform="translate(195 450) rotate(0 0 -32.5)"><path d="M0 0 C0 -19.06, 0 -38.13, 0 -65 M0 0 C0 -23.23, 0 -46.46, 0 -65" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(195 450) rotate(0 0 -32.5)"><path d="M10.26 -36.81 C7.25 -45.08, 4.24 -53.35, 0 -65 M10.26 -36.81 C6.59 -46.88, 2.93 -56.96, 0 -65" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(195 450) rotate(0 0 -32.5)"><path d="M-10.26 -36.81 C-7.25 -45.08, -4.24 -53.35, 0 -65 M-10.26 -36.81 C-6.59 -46.88, -2.93 -56.96, 0 -65" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(545 450) rotate(0 0 -32.5)"><path d="M0 0 C0 -19.06, 0 -38.13, 0 -65 M0 0 C0 -19.59, 0 -39.18, 0 -65" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(545 450) rotate(0 0 -32.5)"><path d="M10.26 -36.81 C7.25 -45.08, 4.24 -53.35, 0 -65 M10.26 -36.81 C7.17 -45.31, 4.08 -53.8, 0 -65" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(545 450) rotate(0 0 -32.5)"><path d="M-10.26 -36.81 C-7.25 -45.08, -4.24 -53.35, 0 -65 M-10.26 -36.81 C-7.17 -45.31, -4.08 -53.8, 0 -65" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g></g><mask></mask><g transform="translate(210 400) rotate(0 75 12.5)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="20px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">访问共享状态</text></g><g transform="translate(560 400) rotate(0 75 12.5)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="20px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">访问共享状态</text></g><g transform="translate(65 580) rotate(0 325 13.125)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="21px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">共享数据的相关读写，需要遵守同一同步规则</text></g><g stroke-linecap="round"><g transform="translate(755 355) rotate(0 105 0)"><path d="M0 0 C61.6 0, 123.2 0, 210 0 M0 0 C58.24 0, 116.49 0, 210 0" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(755 355) rotate(0 105 0)"><path d="M28.19 -10.26 C19.92 -7.25, 11.65 -4.24, 0 0 M28.19 -10.26 C20.37 -7.41, 12.55 -4.57, 0 0" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(755 355) rotate(0 105 0)"><path d="M28.19 10.26 C19.92 7.25, 11.65 4.24, 0 0 M28.19 10.26 C20.37 7.41, 12.55 4.57, 0 0" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(755 355) rotate(0 105 0)"><path d="M181.81 10.26 C190.08 7.25, 198.35 4.24, 210 0 M181.81 10.26 C189.63 7.41, 197.45 4.57, 210 0" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(755 355) rotate(0 105 0)"><path d="M181.81 -10.26 C190.08 -7.25, 198.35 -4.24, 210 0 M181.81 -10.26 C189.63 -7.41, 197.45 -4.57, 210 0" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g></g><mask></mask><g transform="translate(778 275) rotate(0 90 26.25)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="21px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">通过 IPC 协作</text><text x="0" y="26.25" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="21px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">管道 / Socket 等</text></g><g transform="translate(778 395) rotate(0 85 47.5)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="19px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">显式共享内存</text><text x="0" y="23.75" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="19px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">也属于通信方案</text><text x="0" y="47.5" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="19px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">仍须同步</text><text x="0" y="71.25" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="19px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">不是普通变量直通</text></g><g stroke-linecap="round" transform="translate(40 810) rotate(0 635 92.5)"><path d="M0 0 C372.47 0, 744.93 0, 1270 0 M0 0 C433.61 0, 867.22 0, 1270 0 M1270 0 C1270 37.37, 1270 74.75, 1270 185 M1270 0 C1270 54.16, 1270 108.32, 1270 185 M1270 185 C963.97 185, 657.94 185, 0 185 M1270 185 C840.69 185, 411.38 185, 0 185 M0 185 C0 125.74, 0 66.49, 0 0 M0 185 C0 147.54, 0 110.08, 0 0" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(65 835) rotate(0 600 17.5)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="28px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">操作系统内核：调度与资源管理（简化引用总图）</text></g><g transform="translate(65 900) rotate(0 600 28.75)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">调度器从就绪线程中选择执行者；阻塞等待的线程，需先恢复就绪。</text><text x="0" y="28.75" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">上下文切换保存与恢复执行进度；不要求线程永久占有某个核心。</text></g><g stroke-linecap="round"><g transform="translate(395 805) rotate(0 0 -80)"><path d="M0 0 C0 -46.93, 0 -93.86, 0 -160 M0 0 C0 -59.74, 0 -119.48, 0 -160" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(395 805) rotate(0 0 -80)"><path d="M10.26 -131.81 C7.25 -140.08, 4.24 -148.35, 0 -160 M10.26 -131.81 C6.43 -142.34, 2.6 -152.86, 0 -160" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(395 805) rotate(0 0 -80)"><path d="M-10.26 -131.81 C-7.25 -140.08, -4.24 -148.35, 0 -160 M-10.26 -131.81 C-6.43 -142.34, -2.6 -152.86, 0 -160" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(1140 805) rotate(0 0 -80)"><path d="M0 0 C0 -46.93, 0 -93.86, 0 -160 M0 0 C0 -50.78, 0 -101.56, 0 -160" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(1140 805) rotate(0 0 -80)"><path d="M10.26 -131.81 C7.25 -140.08, 4.24 -148.35, 0 -160 M10.26 -131.81 C7 -140.76, 3.75 -149.7, 0 -160" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(1140 805) rotate(0 0 -80)"><path d="M-10.26 -131.81 C-7.25 -140.08, -4.24 -148.35, 0 -160 M-10.26 -131.81 C-7 -140.76, -3.75 -149.7, 0 -160" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g></g><mask></mask><g transform="translate(70 700) rotate(0 155 27.5)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">安排其中的就绪线程</text><text x="0" y="27.5" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">在可用 CPU 上运行</text></g><g transform="translate(800 700) rotate(0 162.5 27.5)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">另一进程的线程</text><text x="0" y="27.5" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">也参加系统调度</text></g><g stroke-linecap="round"><g transform="translate(680 1000) rotate(0 0 47.5)"><path d="M0 0 C0 27.87, 0 55.74, 0 95 M0 0 C0 33.19, 0 66.37, 0 95" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(680 1000) rotate(0 0 47.5)"><path d="M-10.26 66.81 C-7.25 75.08, -4.24 83.35, 0 95 M-10.26 66.81 C-6.68 76.66, -3.09 86.51, 0 95" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(680 1000) rotate(0 0 47.5)"><path d="M10.26 66.81 C7.25 75.08, 4.24 83.35, 0 95 M10.26 66.81 C6.68 76.66, 3.09 86.51, 0 95" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g></g><mask></mask><g transform="translate(710 1030) rotate(0 210 13.75)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">分配执行时间与位置</text></g><g transform="translate(65 1110) rotate(0 605 31.25)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="25px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">CPU 逻辑处理器：实际执行指令的硬件位置</text><text x="0" y="31.25" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="25px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">一个位置可交错执行；多个位置可让不同线程同时执行。</text></g><g transform="translate(40 1240) rotate(0 635 27.5)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">并发描述多项工作的共同推进；并行描述同一时刻的执行。</text><text x="0" y="27.5" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">任务 / 协程 / async 是应用与运行时安排工作的方法，不自动等于新增操作系统线程。</text></g><a href="http://warmhanser.com/articles/knowledge-map#software-overview"><g transform="translate(40 1335) rotate(0 635 13.75)"><text x="0" y="0" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">返回软件系统总图：运行环境与进程边界 / 操作系统与硬件。</text></g></a></svg>