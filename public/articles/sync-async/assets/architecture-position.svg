0px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">完成后使续段可调度</text></g><g stroke-linecap="round" transform="translate(755 800) rotate(0 252.5 92.5)"><path d="M0 0 L505 0 L505 185 L0 185" stroke="none" stroke-width="0" fill="#dbeafe"></path><path d="M0 0 C125.19 0, 250.37 0, 505 0 M505 0 C505 53.99, 505 107.99, 505 185 M505 185 C356.14 185, 207.28 185, 0 185 M0 185 C0 138.78, 0 92.55, 0 0" stroke="#1e40af" stroke-width="1.5" fill="none" stroke-dasharray="8 9"></path></g><g transform="translate(775 820) rotate(0 232.5 70)"><text x="0" y="0" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">可选：Web Worker</text><text x="0" y="27.5" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">独立执行环境与线程</text><text x="0" y="55" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">通过消息与页面交换数据</text><text x="0" y="82.5" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">是否真正并行还取决于资源与调度</text><text x="0" y="110" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">仅写 async 不会建立 Worker</text></g><g stroke-linecap="round"><g transform="translate(220 1020) rotate(0 0 47.5)"><path d="M0 0 C0 23.55, 0 47.1, 0 95 M0 0 C0 22.41, 0 44.81, 0 95" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(220 1020) rotate(0 0 47.5)"><path d="M-10.26 66.81 C-7.72 73.8, -5.17 80.79, 0 95 M-10.26 66.81 C-7.84 73.46, -5.42 80.11, 