  <rect x="0" y="0" width="1340" height="1380" fill="#ffffff"></rect><a href="http://warmhanser.com/articles/sync-async"><g transform="translate(40 40) rotate(0 630 22.5)"><text x="0" y="0" font-family="Cascadia, Segoe UI Emoji" font-size="30px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">05  等待与调度：接口、执行资源、系统能力</text></g></a><g transform="translate(40 100) rotate(0 625 27.5)"><text x="0" y="0" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">第 03 区进程执行的展开；与第 04 区组件协作相连。</text><text x="0" y="27.5" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">范围：浏览器应用与宿主能力。宿主可跨多个进程实现。</text></g><g transform="translate(40 200) rotate(0 300 17.5)"><text x="0" y="0" font-family="Cascadia, Segoe UI Emoji" font-size="26px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">应用：调用与结果约定</text></g><g stroke-linecap="round"><g transform="translate(55 260) rotate(0 0 72.5)"><path d="M0 0 C0 35.93, 0 71.87, 0 145 M0 0 C0 57.42, 0 114.83, 0 145" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(55 280) rotate(0 17.5 0)"><path d="M0 0 C8.67 0, 17.35 0, 35 0 M0 0 C9.38 0, 18.76 0, 35 0" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(55 380) rotate(0 17.5 0)"><path d="M0 0 C8.67 0, 17.35 0, 35 0 M0 0 C11.9 0, 23.8 0, 35 0" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g></g><mask></mask><g transform="translate(105 255) rotate(0 215 32.5)"><text x="0" y="0" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">同步调用</text><text x="0" y="27.5" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">本次调用内完成选定操作</text></g><g transform="translate(105 355) rotate(0 225 45)"><text x="0" y="0" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">异步调用</text><text x="0" y="27.5" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">返回与完成分离</text><text x="0" y="55" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">Promise 表达结果；await 挂起续段</text></g><g stroke-linecap="round" transform="translate(720 200) rotate(0 280 100)"><path d="M0 0 L560 0 L560 200 L0 200" stroke="none" stroke-width="0" fill="#1e293b"></path><path d="M0 0 C138.79 0, 277.57 0, 560 0 M0 0 C199.33 0, 398.65 0, 560 0 M560 0 C560 47.61, 560 95.22, 560 200 M560 0 C560 74.24, 560 148.48, 560 200 M560 200 C388.08 200, 216.17 200, 0 200 M560 200 C343.52 200, 127.05 200, 0 200 M0 200 C0 138.3, 0 76.6, 0 0 M0 200 C0 145.5, 0 91, 0 0" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/await"><g transform="translate(745 225) rotate(0 255 72.5)"><text x="0" y="0" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#ffffff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">await fetch("/api/profile")</text><text x="0" y="27.5" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#ffffff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge"></text><text x="0" y="55" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#ffffff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">fetch：提交请求，返回 Promise</text><text x="0" y="82.5" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#ffffff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">await：保存依赖结果的后续执行</text><text x="0" y="110" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#ffffff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">两个职责，不代表新建线程</text></g></a><g stroke-linecap="round"><g transform="translate(330 465) rotate(0 0 42.5)"><path d="M0 0 C0 21.07, 0 42.13, 0 85 M0 0 C0 25.49, 0 50.99, 0 85" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(330 465) rotate(0 0 42.5)"><path d="M-10.26 56.81 C-7.72 63.8, -5.17 70.78, 0 85 M-10.26 56.81 C-7.18 65.26, -4.11 73.72, 0 85" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(330 465) rotate(0 0 42.5)"><path d="M10.26 56.81 C7.72 63.8, 5.17 70.78, 0 85 M10.26 56.81 C7.18 65.26, 4.11 73.72, 0 85" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g></g><mask></mask><g transform="translate(355 485) rotate(0 225 15)"><text x="0" y="0" font-family="Cascadia, Segoe UI Emoji" font-size="20px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">后续执行依赖宿主调度</text></g><g stroke-linecap="round" transform="translate(40 550) rotate(0 625 235)"><path d="M0 0 C309.82 0, 619.63 0, 1250 0 M0 0 C304.89 0, 609.79 0, 1250 0 M1250 0 C1250 177.93, 1250 355.86, 1250 470 M1250 0 C1250 127.99, 1250 255.99, 1250 470 M1250 470 C808.69 470, 367.39 470, 0 470 M1250 470 C812.25 470, 374.5 470, 0 470 M0 470 C0 342.51, 0 215.02, 0 0 M0 470 C0 339.07, 0 208.14, 0 0" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(65 575) rotate(0 580 17.5)"><text x="0" y="0" font-family="Cascadia, Segoe UI Emoji" font-size="26px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">宿主运行环境：提供 API、调度与执行支持</text></g><g transform="translate(70 650) rotate(0 215 50)"><text x="0" y="0" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">页面事件循环 / 微任务机制</text><text x="0" y="27.5" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">安排可执行的处理与续段</text><text x="0" y="55" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">同一 agent 的代码逐段执行</text></g><g transform="translate(790 650) rotate(0 222.5 50)"><text x="0" y="0" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">页面主线程</text><text x="0" y="27.5" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">承载业务 JavaScript 执行</text><text x="0" y="55" font-family="Cascadia, Segoe UI Emoji" font-size="22px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="text-before-edge">长计算仍会占用它</text></g><g stroke-linecap="round"><g transform="translate(495 705) rotate(0 137.5 0)"><path d="M0 0 C68.16 0, 136.33 0, 275 0 M0 0 C91.27 0, 182.54 0, 275 0" stroke="#1e3a5f" stroke-width="1" fill="none"></path></g><g transform="translate(495 705) rotate(0 137.5 0)"><path d="M246.81 10.26 C253.8 7.72, 260.78 5.17, 275 0 M246.81 10.26 C256.17 6.86, 265.52 3.45, 27