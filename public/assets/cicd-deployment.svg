<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1510" viewBox="0 0 1240 1510" role="img" aria-labelledby="title description">
  <title id="title">CI/CD 部署结构：GitHub、Windows 与 WSL、云服务器</title>
  <desc id="description">GitHub 的两个仓库分别触发 OpenAI Codex Code Review 和本地 Jenkins。Windows 电脑内包含桌面客户端与 WSL Docker Engine；WSL 内由 Jenkins 调度按需 CI 和构建容器，使用 Harbor 保存主页和白板镜像。镜像、后端程序和安装包分别进入云服务器。桌面客户端通过 HTTPS 连接 Nginx，再访问私有 Agent、网站与安装包。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="m2 1 6 4-6 4" fill="none" stroke="#8d9195" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; text-anchor: middle; fill: #0058a8; font-size: 21px; font-weight: 600; }
      .boundary { fill: none; stroke: #e5e7eb; stroke-width: 1.2; }
      .node { fill: #e5f3ff; stroke: #d6dfe6; stroke-width: 1.4; }
      .label { fill: #f5faff; stroke: #cbddee; stroke-width: 1.3; }
      .edge { fill: none; stroke: #8d9195; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arrow); }
      .group-title { fill: #343a40; font-size: 20px; font-weight: 400; }
      .edge-label { font-size: 18px; }
      .detail { font-size: 17px; font-weight: 400; }
    </style>
  </defs>
  <path fill="#fff" d="M0 0h1240v1510H0z"/>

  <g aria-label="部署边界">
    <rect class="boundary" x="430" y="252" width="760" height="650"/>
    <rect class="boundary" x="784" y="310" width="380" height="570"/>
    <rect class="boundary" x="40" y="930" width="1160" height="500"/>
  </g>

  <g aria-label="事件与产物流向">
    <path class="edge" d="M772 120V170Q772 182 760 182H220Q208 182 208 194V246"/>
    <path class="edge" d="M974 120V346"/>
    <path class="edge" d="M974 436V470"/>
    <path class="edge" d="M974 564V678"/>
    <path class="edge" d="M974 768V1000"/>
    <path class="edge" d="M605 804V888Q605 900 593 900H262Q250 900 250 912V1080"/>
    <path class="edge" d="M1080 564V598Q1080 610 1092 610H1198Q1210 610 1210 622V1320Q1210 1332 1198 1332H1140"/>
    <path class="edge" d="M400 1112H548Q560 1112 560 1100V1064Q560 1052 572 1052H720"/>
    <path class="edge" d="M400 1132H588Q600 1132 600 1144V1180Q600 1192 612 1192H720"/>
    <path class="edge" d="M400 1154H518Q530 1154 530 1166V1320Q530 1332 542 1332H720"/>
    <path d="M870 564V578Q870 590 858 590H784Q772 590 772 602V848Q772 860 784 860H1158Q1170 860 1170 872V1180Q1170 1192 1158 1192H1140" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
    <path class="edge" d="M870 564V578Q870 590 858 590H784Q772 590 772 602V848Q772 860 784 860H1158Q1170 860 1170 872V1180Q1170 1192 1158 1192H1140"/>
  </g>

  <g aria-label="环境名称">
    <rect x="670" y="254" width="280" height="28" fill="#fff"/>
    <text class="group-title" x="810" y="275">你的 Windows 电脑</text>
    <rect x="850" y="312" width="248" height="29" fill="#fff"/>
    <text class="group-title" x="974" y="333">WSL Docker Engine</text>
    <text class="group-title" x="620" y="961">云服务器</text>
  </g>

  <g aria-label="外部服务">
    <rect class="node" x="642" y="36" width="390" height="84" rx="24"/>
    <text x="837" y="86">GitHub：两个仓库、PR、main</text>
    <rect class="node" x="40" y="256" width="360" height="84" rx="24"/>
    <text x="220" y="306" font-size="20">OpenAI：Codex Code Review</text>
  </g>

  <g aria-label="Windows 与 WSL 内的组件">
    <rect class="node" x="822" y="356" width="304" height="80" rx="24"/>
    <text x="974" y="404">Jenkins：调度流水线</text>
    <rect class="node" x="800" y="480" width="348" height="84" rx="24"/>
    <text x="974" y="530" font-size="20">按需启动的 CI / 构建容器</text>
    <rect class="node" x="800" y="688" width="348" height="80" rx="24"/>
    <text x="974" y="736">Harbor：保存 Docker 镜像</text>
    <rect class="node" x="455" y="720" width="300" height="84" rx="24"/>
    <text x="605" y="770" font-size="20">Study Agent 桌面客户端</text>
  </g>

  <g aria-label="云端运行组件">
    <rect class="node" x="100" y="1090" width="300" height="84" rx="24"/>
    <text x="250" y="1140" font-size="20">Nginx：HTTPS 公网入口</text>
    <rect class="node" x="730" y="1010" width="400" height="84" rx="24"/>
    <text x="930" y="1045">个人主页 / 学习白板</text>
    <text class="detail" x="930" y="1074">PostgreSQL · 网站相关数据</text>
    <rect class="node" x="730" y="1150" width="400" height="84" rx="24"/>
    <text x="930" y="1186">Study Agent 私有运行服务</text>
    <text class="detail" x="930" y="1215">systemd 管理后端进程</text>
    <rect class="node" x="730" y="1290" width="400" height="84" rx="24"/>
    <text x="930" y="1340">Windows 安装包下载目录</text>
  </g>

  <g aria-label="连接说明">
    <rect class="label" x="142" y="190" width="132" height="36" rx="18"/>
    <text class="edge-label" x="208" y="214">PR 自动审查</text>
    <rect class="label" x="792" y="168" width="364" height="38" rx="19"/>
    <text class="edge-label" x="974" y="193">事件经云端和 SSH 隧道转发</text>
    <rect class="label" x="870" y="614" width="208" height="38" rx="19"/>
    <text class="edge-label" x="974" y="639">主页 / 白板镜像</text>
    <rect class="label" x="870" y="944" width="208" height="36" rx="18"/>
    <text class="edge-label" x="974" y="968">云端拉取镜像</text>
    <rect class="label" x="446" y="882" width="106" height="36" rx="18"/>
    <text class="edge-label" x="499" y="906">HTTPS</text>
    <rect class="label" x="798" y="842" width="136" height="36" rx="18"/>
    <text class="edge-label" x="866" y="866">发布后端</text>
    <rect class="label" x="1074" y="584" width="142" height="36" rx="18"/>
    <text class="edge-label" x="1145" y="608">发布安装包</text>
  </g>
  <text class="detail" x="620" y="1475" fill="#596671">PR 检查与 main 发布分别执行；PR 测试容器不持有发布凭据。</text>
</svg>
