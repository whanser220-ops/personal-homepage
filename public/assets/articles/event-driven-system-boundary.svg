<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">系统级事件驱动边界</title>
  <desc id="desc">生产者发布事实到事件通道，事件通道把它分发给通知、统计和索引等独立消费者。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#36586b"/></marker>
    <style>
      .bg{fill:#fffdf9}.title{font:700 25px 'Microsoft YaHei',sans-serif;fill:#243f50}.small{font:500 17px 'Microsoft YaHei',sans-serif;fill:#52646a}.label{font:700 19px 'Microsoft YaHei',sans-serif;fill:#243f50}.mono{font:700 16px Consolas,monospace;fill:#36586b}.line{stroke:#36586b;stroke-width:3;fill:none;marker-end:url(#arrow)}.box{stroke:#b8c8c2;stroke-width:2}.producer{fill:#e8f0ed}.channel{fill:#f6eadb}.consumer{fill:#e8eef3}.note{fill:#f8f1e6;stroke:#d5b27f;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1200" height="520" rx="18"/>
  <text class="title" x="50" y="54">系统级事件驱动：连接被解耦，契约仍在</text>
  <text class="small" x="50" y="84">生产者不写消费者函数名；消费者各自决定如何反应。</text>
  <rect class="box producer" x="55" y="170" width="240" height="110" rx="14"/>
  <text class="label" x="82" y="210">生产者</text><text class="small" x="82" y="241">业务状态已经改变</text><text class="mono" x="82" y="266">order.paid</text>
  <rect class="box channel" x="430" y="135" width="340" height="180" rx="16"/>
  <text class="label" x="474" y="180">事件通道 / broker</text><text class="small" x="474" y="214">路由、缓冲、持久化</text><text class="small" x="474" y="244">重试、确认、观测</text><text class="mono" x="474" y="282">publish(event)</text>
  <rect class="box consumer" x="905" y="95" width="220" height="86" rx="14"/>
  <text class="label" x="934" y="132">通知消费者</text><text class="small" x="934" y="160">发送邮件</text>
  <rect class="box consumer" x="905" y="215" width="220" height="86" rx="14"/>
  <text class="label" x="934" y="252">统计消费者</text><text class="small" x="934" y="280">更新报表</text>
  <rect class="box consumer" x="905" y="335" width="220" height="86" rx="14"/>
  <text class="label" x="934" y="372">索引消费者</text><text class="small" x="934" y="400">更新搜索视图</text>
  <path class="line" d="M295 225H430"/><path class="line" d="M770 180H905"/><path class="line" d="M770 258H905"/><path class="line" d="M770 376H905"/>
  <text class="small" x="329" y="207">事实</text><text class="small" x="798" y="162">分发</text>
  <rect class="note" x="75" y="365" width="700" height="78" rx="12"/>
  <text class="small" x="104" y="397">注意：事件解耦了直接调用，却没有消除事件名、字段、版本和</text>
  <text class="small" x="104" y="423">重复 / 失败处理等契约。跨进程后，“已发布”也不等于“已完成”。</text>
</svg>
