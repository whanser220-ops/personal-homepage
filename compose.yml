name: personal-homepage

services:
  personal-homepage:
    image: ${APP_IMAGE:-127.0.0.1:18081/personal-homepage/personal-homepage:latest}
    container_name: ${CONTAINER_NAME:-personal-homepage}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-/etc/personal-homepage/app.env}
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    networks:
      - personal-homepage-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  personal-homepage-net:
    external: true
    name: ${DOCKER_NETWORK:-personal-homepage-net}
