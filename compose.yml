name: personal-homepage

services:
  personal-homepage:
    image: ${APP_IMAGE:-127.0.0.1:18081/personal-homepage/personal-homepage:latest}
    container_name: ${CONTAINER_NAME:-personal-homepage}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-/etc/personal-homepage/app.env}
      - ${MONITOR_ENV_FILE:-/etc/personal-homepage-monitor/web.env}
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    networks:
      - personal-homepage-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  learning-whiteboard:
    image: ${WHITEBOARD_IMAGE:-127.0.0.1:18081/personal-homepage/learning-whiteboard:latest}
    container_name: learning-whiteboard
    restart: unless-stopped
    env_file:
      - ${WHITEBOARD_ENV_FILE:-/etc/learning-whiteboard/service.env}
    environment:
      PORT: "4310"
      HOST: "0.0.0.0"
      WHITEBOARD_DATA_DIR: /app/data
      WHITEBOARD_SEED_DIR: /app/seed
      PUBLIC_BASE_URL: https://warmhanser.com
    ports:
      - "127.0.0.1:4310:4310"
    volumes:
      - /var/lib/learning-whiteboard:/app/data
    networks:
      - personal-homepage-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/whiteboard/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  personal-homepage-net:
    external: true
    name: ${DOCKER_NETWORK:-personal-homepage-net}
