apiVersion: 1
datasources:
  - name: Legacy resource history
    uid: monitor-legacy-history
    type: grafana-postgresql-datasource
    access: proxy
    url: $MONITOR_HISTORY_HOST:$MONITOR_HISTORY_PORT
    user: $MONITOR_HISTORY_USER
    editable: false
    version: 1
    jsonData:
      database: $MONITOR_HISTORY_DATABASE
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 2
      maxIdleConns: 1
      connMaxLifetime: 300
      timeInterval: 3s
    secureJsonData:
      password: $MONITOR_HISTORY_PASSWORD
