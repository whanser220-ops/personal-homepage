apiVersion: 1
datasources:
  - name: Server Prometheus
    uid: monitor-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:19090
    isDefault: true
    editable: false
    version: 1
    jsonData:
      httpMethod: POST
      timeInterval: 3s
      queryTimeout: 8s
      prometheusType: Prometheus
      prometheusVersion: 3.13.5
      manageAlerts: false
      cacheLevel: Low
      disableRecordingRules: true
      incrementalQuerying: false
