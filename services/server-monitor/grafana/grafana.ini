[paths]
data = /var/lib/personal-homepage-grafana
logs = /var/lib/personal-homepage-grafana/log
plugins = /var/lib/personal-homepage-grafana/plugins
provisioning = /etc/personal-homepage-grafana/provisioning

[server]
protocol = http
http_addr = 127.0.0.1
http_port = 19110
domain = warmhanser.com
root_url = https://warmhanser.com/server-monitor/grafana/
serve_from_sub_path = true
enable_gzip = true
router_logging = false

[database]
type = sqlite3
path = /var/lib/personal-homepage-grafana/grafana.db
wal = true
high_availability = false

[security]
disable_initial_admin_creation = true
cookie_secure = true
cookie_samesite = lax
allow_embedding = true
disable_gravatar = true
strict_transport_security = false
csrf_trusted_origins = https://warmhanser.com

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_id = 1
auto_assign_org_role = Viewer
viewers_can_edit = false
default_theme = system
default_language = zh-Hans

[auth]
disable_login_form = true
disable_signout_menu = true

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = email
auto_sign_up = true
sync_ttl = 0
whitelist = 127.0.0.1
headers = Role:X-WEBAUTH-ROLE Email:X-WEBAUTH-EMAIL
enable_login_token = false

[dashboards]
min_refresh_interval = 3s
default_home_dashboard_path = /etc/personal-homepage-grafana/dashboards/overview.json
versions_to_keep = 3

[dataproxy]
timeout = 10

[query]
concurrent_query_limit = 2

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
plugin_admin_enabled = false
preinstall_disabled = true
public_key_retrieval_disabled = true

[news]
news_feed_enabled = false

[unified_alerting]
enabled = false

[snapshots]
enabled = false
external_enabled = false
public_mode = false

[live]
max_connections = 0

[log]
mode = console
level = warn

[metrics]
enabled = false
