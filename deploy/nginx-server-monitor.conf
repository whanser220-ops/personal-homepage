# Both vhosts include this file. Ingestion is available only on loopback :3000.
location ~ ^/api/monitor/ingest(?:/|$) {
    return 404;
}

# The upstream identity is always produced by the existing Google DB session.
# The internal endpoint never accepts an identity supplied by the browser.
location = /_monitor_grafana_auth {
    internal;
    proxy_pass http://personal_homepage_app/api/monitor/auth/grafana;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host warmhanser.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
    proxy_set_header X-WEBAUTH-USER "";
    proxy_set_header X-WEBAUTH-EMAIL "";
    proxy_set_header X-WEBAUTH-ROLE "";
    proxy_set_header X-WEBAUTH-NAME "";
    proxy_set_header X-WEBAUTH-GROUPS "";
    proxy_set_header X-Monitor-User "";
    proxy_cache off;
    proxy_read_timeout 10s;
    access_log off;
}

location = /server-monitor/grafana {
    return 308 https://warmhanser.com/server-monitor/grafana/;
}

location ^~ /server-monitor/grafana/ {
    if ($scheme = http) { return 308 https://warmhanser.com$request_uri; }
    auth_request /_monitor_grafana_auth;
    auth_request_set $monitor_grafana_user $upstream_http_x_monitor_user;
    error_page 401 = @monitor_grafana_unauthorized;
    proxy_pass http://127.0.0.1:19110;
    proxy_http_version 1.1;
    proxy_set_header Host warmhanser.com;
    proxy_set_header X-Forwarded-Host warmhanser.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_set_header X-WEBAUTH-USER $monitor_grafana_user;
    proxy_set_header X-WEBAUTH-EMAIL $monitor_grafana_user;
    proxy_set_header X-WEBAUTH-ROLE Viewer;
    proxy_set_header X-WEBAUTH-NAME "";
    proxy_set_header X-WEBAUTH-GROUPS "";
    proxy_set_header X-Monitor-User "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 30s;
    client_max_body_size 256k;
    add_header Cache-Control $monitor_grafana_cache_control always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location @monitor_grafana_unauthorized {
    if ($http_accept ~* text/html) { return 302 /server-monitor; }
    add_header Cache-Control "no-store" always;
    return 401;
}

location ~ ^/(?:server-monitor(?:/|$)|api/monitor(?:/|$)) {
    if ($scheme = http) { return 308 https://warmhanser.com$request_uri; }
    proxy_pass http://personal_homepage_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 512k;
    proxy_read_timeout 30s;
}
