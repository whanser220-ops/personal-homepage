# Both vhosts include this file. Ingestion is available only on loopback :3000.
location ~ ^/api/monitor/ingest(?:/|$) {
    return 404;
}

location ~ ^/(?:server-monitor(?:/|$)|api/monitor(?:/|$)) {
    if ($scheme = http) { return 308 https://warmhanser.com$request_uri; }
    proxy_pass http://personal_homepage_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 512k;
    proxy_read_timeout 30s;
}
