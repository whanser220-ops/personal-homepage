# http-context only. The dedicated metric log contains no request identifiers.
log_format monitor_http escape=json '{"service":"$monitor_http_service","status":$status,"request_time":$request_time,"body_bytes_sent":$body_bytes_sent}';

map $uri $monitor_http_service {
    default website;
    ~^/(?:server-monitor|api/monitor)(?:/|$) "";
    ~^/(?:api/health|health)(?:/|$) "";
    ~^/(?:whiteboard|study)/(?:api/)?health(?:/|$) "";
    ~^/whiteboard(?:/|$) whiteboard;
    ~^/study(?:/|$) study-agent;
}

# Long-lived streams measure connection lifetime rather than request latency.
map "$monitor_http_service:$http_upgrade:$sent_http_content_type" $monitor_http_record {
    default 1;
    ~^: 0;
    ~^[^:]+:[^:]+: 0;
    ~*text/event-stream 0;
}
## Browser-private caching is restricted to content-addressed Grafana code,
## fonts and images. Evaluated during header filtering, so errors and redirects
## remain no-store. The authenticated proxy location is shared by every path.
map "$request_method:$status:$uri" $monitor_grafana_cache_control {
    default "no-store";
    "~^(?:GET|HEAD):(?:200|206|304):/server-monitor/grafana/public/(?:build|fonts|img)/(?:[A-Za-z0-9_-]+/)*(?:[A-Za-z0-9_-]+\.)+[0-9a-f]{8,64}\.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico)$" "private, max-age=31536000, immutable";
}
