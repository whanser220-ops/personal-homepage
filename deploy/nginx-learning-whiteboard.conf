# Public board viewing and authenticated MCP calls use the independent service.
# Always upgrade MCP traffic to TLS before accepting credentials.
location = /whiteboard { return 302 /articles/knowledge-map; }
location = /whiteboard/mcp {
    if ($scheme = http) { return 308 https://warmhanser.com$request_uri; }
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:4310;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
}
location ^~ /whiteboard/ {
    proxy_pass http://127.0.0.1:4310;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
